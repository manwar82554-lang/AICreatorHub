```html
<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">

    <title>Create Account - AICreatorHub</title>

    <style>

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            min-height: 100vh;
            background:
                radial-gradient(circle at top right, rgba(91,91,247,0.14), transparent 35%),
                linear-gradient(135deg, #f0f1ff, #f7f9fc);
            color: #172033;
            padding: 20px;
        }

        a {
            text-decoration: none;
        }

        .page {
            width: 100%;
            max-width: 500px;
            margin: 0 auto;
        }

        .brand {
            text-align: center;
            margin: 20px 0;
        }

        .logo {
            font-size: 30px;
            font-weight: 800;
            color: #171b2e;
        }

        .logo span {
            color: #5b5bf7;
        }

        .brand p {
            color: #687080;
            font-size: 14px;
            margin-top: 6px;
        }

        .register-box {
            background: white;
            border: 1px solid #e5e7eb;
            border-radius: 20px;
            padding: 38px;
            box-shadow: 0 18px 45px rgba(0,0,0,0.08);
        }

        .badge {
            display: table;
            margin: 0 auto 14px;
            background: #ececff;
            color: #4d4ddc;
            padding: 7px 14px;
            border-radius: 30px;
            font-size: 12px;
            font-weight: bold;
        }

        h1 {
            text-align: center;
            font-size: 30px;
            margin-bottom: 8px;
        }

        .subtitle {
            text-align: center;
            color: #687080;
            font-size: 14px;
            margin-bottom: 28px;
            line-height: 1.6;
        }

        label {
            display: block;
            margin-bottom: 7px;
            font-size: 14px;
            font-weight: bold;
        }

        input {
            width: 100%;
            padding: 13px 14px;
            margin-bottom: 18px;
            border: 1px solid #d8dce5;
            border-radius: 9px;
            outline: none;
            font-size: 15px;
            transition: 0.2s;
        }

        input:focus {
            border-color: #5b5bf7;
            box-shadow: 0 0 0 3px rgba(91,91,247,0.10);
        }

        button {
            width: 100%;
            padding: 14px;
            border: none;
            border-radius: 9px;
            background: #5b5bf7;
            color: white;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: 0.2s;
            margin-top: 4px;
        }

        button:hover {
            background: #4747d8;
            transform: translateY(-1px);
        }

        .login-link {
            text-align: center;
            margin-top: 22px;
            color: #687080;
            font-size: 14px;
        }

        .login-link a {
            color: #5b5bf7;
            font-weight: bold;
        }

        .login-link a:hover {
            text-decoration: underline;
        }

        .home-link {
            display: block;
            text-align: center;
            margin-top: 18px;
            color: #687080;
            font-size: 13px;
        }

        .home-link:hover {
            color: #5b5bf7;
        }

        .info {
            margin-top: 18px;
            padding: 12px 15px;
            background: #f8f9ff;
            border: 1px solid #e9eaff;
            border-radius: 9px;
            color: #687080;
            font-size: 12px;
            line-height: 1.5;
            text-align: center;
        }

        @media (max-width: 500px) {

            .register-box {
                padding: 28px 22px;
            }

            .logo {
                font-size: 27px;
            }

            h1 {
                font-size: 26px;
            }

        }

    </style>

</head>


<body>


<div class="page">


    <div class="brand">

        <div class="logo">
            AI<span>CreatorHub</span>
        </div>

        <p>
            AI tools for creators
        </p>

    </div>


    <div class="register-box">


        <div class="badge">
            ✨ Join AICreatorHub
        </div>


        <h1>
            Create Your Account
        </h1>


        <p class="subtitle">
            Create your account and start using AICreatorHub creator tools.
        </p>


        <form action="/register" method="POST">

<input type="hidden" name="csrf_token" value="{{ csrf_token() }}">

            <label for="name">
                Full Name
            </label>

            <input
                type="text"
                id="name"
                name="name"
                placeholder="Enter your name"
                required
            >


            <label for="email">
                Email
            </label>

            <input
                type="email"
                id="email"
                name="email"
                placeholder="Enter your email"
                required
            >


            <label for="password">
                Password
            </label>

            <input
                type="password"
                id="password"
                name="password"
                placeholder="Create a password"
                required
            >


            <label for="confirm_password">
                Confirm Password
            </label>

            <input
                type="password"
                id="confirm_password"
                name="confirm_password"
                placeholder="Confirm your password"
                required
            >


            <button type="submit">
                Create Account
            </button>


        </form>


        <div class="info">
            Your password is stored securely using password hashing.
        </div>


        <div class="login-link">

            Already have an account?

            <a href="/login">
                Login
            </a>

        </div>


        <a href="/" class="home-link">
            ← Back to Home
        </a>


    </div>


</div>


</body>

</html>
```
