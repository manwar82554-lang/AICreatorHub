<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">

    <title>Change Password - AICreatorHub</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            min-height: 100vh;
            background:
                radial-gradient(circle at top right, rgba(91,91,247,0.12), transparent 30%),
                linear-gradient(135deg, #f0f1ff, #f7f9fc);
            color: #172033;
        }

        .container {
            max-width: 600px;
            margin: 60px auto;
            padding: 20px;
        }

        .box {
            background: white;
            border: 1px solid #e5e7eb;
            border-radius: 20px;
            padding: 35px;
            box-shadow: 0 18px 45px rgba(0,0,0,0.07);
        }

        h1 {
            text-align: center;
            margin-bottom: 10px;
        }

        .subtitle {
            text-align: center;
            color: #687080;
            margin-bottom: 30px;
        }

        label {
            display: block;
            font-weight: bold;
            margin-bottom: 7px;
        }

        input {
            width: 100%;
            padding: 13px;
            margin-bottom: 18px;
            border: 1px solid #d9dce5;
            border-radius: 9px;
            box-sizing: border-box;
        }

        button {
            width: 100%;
            padding: 14px;
            background: #5b5bf7;
            color: white;
            border: none;
            border-radius: 9px;
            font-weight: bold;
            cursor: pointer;
        }

        button:hover {
            background: #4747d8;
        }

        .back {
            display: block;
            text-align: center;
            margin-top: 20px;
            color: #5b5bf7;
            font-weight: bold;
            text-decoration: none;
        }

        .security {
            margin-top: 20px;
            padding: 12px;
            background: #f8fafc;
            border: 1px solid #e5e7eb;
            border-radius: 9px;
            text-align: center;
            color: #687080;
            font-size: 13px;
        }

        @media (max-width: 600px) {
            .container {
                margin: 30px auto;
                padding: 14px;
            }

            .box {
                padding: 25px 20px;
            }
        }
    </style>

</head>

<body>

<div class="container">

    <div class="box">

        <h1>Change Password</h1>

        <p class="subtitle">
            Update your AICreatorHub account password.
        </p>

        <form action="/change-password" method="POST">

            <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">

            <label>Current Password</label>
            <input
                type="password"
                name="current_password"
                required
            >

            <label>New Password</label>
            <input
                type="password"
                name="new_password"
                minlength="8"
                required
            >

            <label>Confirm New Password</label>
            <input
                type="password"
                name="confirm_password"
                minlength="8"
                required
            >

            <button type="submit">
                Change Password
            </button>

        </form>

        <a href="/profile" class="back">
            ← Back to Profile
        </a>

        <div class="security">
            🔒 Your password is stored securely using password hashing.
        </div>

    </div>

</div>

</body>

</html>
